name: Build and Submit Mobile App

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'

jobs:
  build_android:
    name: Build Android Production
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit Android Production
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
    env:
      EXPO_DEBUG: "1"

  build_ios:
    name: Build iOS Production
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit iOS Production
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
    env:
      EXPO_DEBUG: "1"
